{{.HomeHTML}}
{{if .ShowRecent}}<h1>recent posts</h1>
{{if .Posts}}<ul class="blog-posts">
  {{range .Posts}}<li><span><time datetime="{{.DateISO}}">{{.DatePretty}}</time></span><a href="/articles/{{.Slug}}.html">{{.Title}}</a></li>
  {{end}}</ul>
  <p class="more"><a href="/articles/">more »</a></p>
{{else}}<p>no posts yet.</p>{{end}}{{end}}
