<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{.Description}}">
  <title>{{if and .Title (ne .Title .SiteTitle)}}{{.Title}} - {{end}}{{.SiteTitle}}</title>
  <meta name="color-scheme" content="light dark">
  <script>
    // Inline on purpose: applies a saved theme before first paint so it never flashes.
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || t === "light") {
          document.querySelector('meta[name="color-scheme"]').content = t;
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/assets-blog/style.css">
  {{if .CustomCSS}}<link rel="stylesheet" href="/assets-blog/custom.css">{{end}}
  <script defer src="/assets-blog/theme-and-visited.js"></script>
</head>
<body{{if .BodyClass}} class="{{.BodyClass}}"{{end}}>
  <header>
    <h1 class="title"><a href="/">{{.SiteTitle}}</a></h1>
    <nav>
      <div class="squiggle" aria-hidden="true"></div>
      <div class="nav-row">
        {{if .Nav}}<p>{{range .Nav}}<a href="{{.URL}}">{{.Label}}</a> {{end}}</p>{{end}}
        <button id="theme-toggle" aria-label="toggle dark mode"></button>
      </div>
    </nav>
  </header>
  <main>
    {{.Content}}
  </main>
  <footer>{{.Footer}}</footer>
</body>
</html>
