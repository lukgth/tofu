<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{.Description}}">
  <title>{{.Title}} — {{.SiteTitle}}</title>
  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (t === "dark" || t === "light") {
        document.documentElement.classList.add(t);
      }
    })();
  </script>
  <link rel="stylesheet" href="/assets-blog/style.css">
</head>
<body{{if .BodyClass}} class="{{.BodyClass}}"{{end}}>
  <header>
    <a class="title" href="/"><h1>{{.SiteTitle}}</h1></a>
    <nav>
      <h2>{{.SiteTitle}}</h2>
      <div class="squiggle" aria-hidden="true"></div>
      <div class="nav-row">
        <p>{{range .Nav}}<a href="{{.URL}}">{{.Label}}</a> {{end}}</p>
        <button id="theme-toggle" aria-label="toggle dark mode"></button>
      </div>
    </nav>
  </header>
  <main>
    {{.Content}}
  </main>
  <footer>{{.Footer}}</footer>
  <script>
    (function () {
      var btn = document.getElementById("theme-toggle");
      var root = document.documentElement;
      function paint() {
        var dark = root.classList.contains("dark") ||
          (!root.classList.contains("light") &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        btn.textContent = dark ? "☀" : "☾";
      }
      btn.addEventListener("click", function () {
        var next = root.classList.contains("dark") ? "light" : "dark";
        root.classList.remove("light", "dark");
        root.classList.add(next);
        localStorage.setItem("theme", next);
        paint();
      });
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paint);
      paint();
    })();
  </script>
  <script>
    (function () {
      // Remember visited post pages and italicize their titles in lists.
      if (location.pathname.startsWith("/articles/") && location.pathname.endsWith(".html")
          && !location.pathname.startsWith("/articles/tag/")) {
        try {
          var seen = JSON.parse(localStorage.getItem("visited-posts") || "{}");
          seen[location.pathname] = true;
          localStorage.setItem("visited-posts", JSON.stringify(seen));
        } catch (e) {}
      }
      document.querySelectorAll('ul.blog-posts a[href^="/articles/"]').forEach(function (a) {
        try {
          var seen = JSON.parse(localStorage.getItem("visited-posts") || "{}");
          if (seen[a.getAttribute("href")]) a.classList.add("visited-post");
        } catch (e) {}
      });
    })();
   </script>
</body>
</html>
