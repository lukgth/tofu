<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{.Description}}">
  <title>{{.Title}} — {{.SiteTitle}}</title>
  <link rel="stylesheet" href="/assets-blog/style.css">
  {{.ExtraHead}}
</head>
<body{{if .BodyClass}} class="{{.BodyClass}}"{{end}}>
  <header>
    <a class="title" href="/"><h1>{{.SiteTitle}}</h1></a>
    <nav>
      <h2>{{.SiteTitle}}</h2>
      <div class="squiggle" aria-hidden="true"></div>
      <p>{{range .Nav}}<a href="{{.URL}}">{{.Label}}</a> {{end}}</p>
    </nav>
  </header>
  <main>
    {{.Content}}
  </main>
  <footer>{{.Footer}}</footer>
</body>
</html>
