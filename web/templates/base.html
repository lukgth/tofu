<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{.Description}}">
  <title>{{.Title}} - {{.SiteTitle}}</title>
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (t === "dark" || t === "light") {
        document.querySelector('meta[name="color-scheme"]').content = t;
      }
    })();
  </script>
  <link rel="stylesheet" href="/assets-blog/style.css">
</head>
<body{{if .BodyClass}} class="{{.BodyClass}}"{{end}}>
  <header>
    <a class="title" href="/"><h1>{{.SiteTitle}}</h1></a>
    <nav>
      <h2>{{.SiteTitle}}</h2>
      <div class="squiggle" aria-hidden="true"></div>
      <div class="nav-row">
        <p>{{range .Nav}}<a href="{{.URL}}">{{.Label}}</a> {{end}}</p>
        <button id="theme-toggle" aria-label="toggle dark mode"></button>
      </div>
    </nav>
  </header>
  <main>
    {{.Content}}
  </main>
  <footer>{{.Footer}}</footer>
  <script>
    (function () {
      var meta = document.querySelector('meta[name="color-scheme"]');
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      var btn = document.getElementById("theme-toggle");
      function current() {
        if (meta.content === "dark") return "dark";
        if (meta.content === "light") return "light";
        return mq.matches ? "dark" : "light";
      }
      function paint() {
        btn.textContent = current() === "dark" ? "\u2600" : "\u263e";
      }
      btn.addEventListener("click", function () {
        var next = current() === "dark" ? "light" : "dark";
        meta.content = next;
        localStorage.setItem("theme", next);
        paint();
      });
      mq.addEventListener("change", paint);
      paint();
    })();
  </script>
  <script>
    (function () {
      // Italicize visited post links. :visited can't set font-style
      // (MDN: color properties only), and no JS API reads history, so
      // track visits ourselves. localStorage is the simplest store.
      var path = location.pathname;
      if (path.startsWith("/articles/") && path.endsWith(".html") && !path.startsWith("/articles/tag/")) {
        try { localStorage.setItem("v:" + path, 1); } catch (e) {}
      }
      document.querySelectorAll('ul.blog-posts a[href^="/articles/"]').forEach(function (a) {
        try { if (localStorage.getItem("v:" + a.getAttribute("href"))) a.classList.add("visited-post"); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
