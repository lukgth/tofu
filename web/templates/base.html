<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{.Description}}">
  <title>{{.Title}} - {{.SiteTitle}}</title>
  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (t === "dark" || t === "light") {
        document.documentElement.classList.add(t);
      }
    })();
  </script>
  <link rel="stylesheet" href="/assets-blog/style.css">
</head>
<body{{if .BodyClass}} class="{{.BodyClass}}"{{end}}>
  <header>
    <a class="title" href="/"><h1>{{.SiteTitle}}</h1></a>
    <nav>
      <h2>{{.SiteTitle}}</h2>
      <div class="squiggle" aria-hidden="true"></div>
      <div class="nav-row">
        <p>{{range .Nav}}<a href="{{.URL}}">{{.Label}}</a> {{end}}</p>
        <button id="theme-toggle" aria-label="toggle dark mode"></button>
      </div>
    </nav>
  </header>
  <main>
    {{.Content}}
  </main>
  <footer>{{.Footer}}</footer>
  <script>
    (function () {
      var btn = document.getElementById("theme-toggle");
      var root = document.documentElement;
      function paint() {
        var dark = root.classList.contains("dark") ||
          (!root.classList.contains("light") &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        btn.textContent = dark ? "☀" : "☾";
      }
      btn.addEventListener("click", function () {
        var next = root.classList.contains("dark") ? "light" : "dark";
        root.classList.remove("light", "dark");
        root.classList.add(next);
        localStorage.setItem("theme", next);
        paint();
      });
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paint);
      paint();
    })();
  </script>
  <script>
    (function () {
      // Italicize visited post links. :visited can't set font-style
      // (MDN: color properties only), and no JS API reads history, so
      // track visits ourselves. localStorage is the simplest store.
      var path = location.pathname;
      if (path.startsWith("/articles/") && path.endsWith(".html") && !path.startsWith("/articles/tag/")) {
        try { localStorage.setItem("v:" + path, 1); } catch (e) {}
      }
      document.querySelectorAll('ul.blog-posts a[href^="/articles/"]').forEach(function (a) {
        try { if (localStorage.getItem("v:" + a.getAttribute("href"))) a.classList.add("visited-post"); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
